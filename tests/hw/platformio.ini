; papilio_wishbone_sdram Hardware Tests
; Run: pio test -e esp32

[platformio]
default_envs = esp32

[env:esp32]
platform    = espressif32
board       = esp32dev
framework   = arduino
test_speed  = 115200

lib_deps =
    file://../../            ; papilio_wishbone_sdram (this library)
    file://../../../papilio_wishbone_bus  ; or adjust to your workspace path

build_flags =
    -DUNIT_TEST
    -DTEST_SDRAM_BASE_ADDR=0x8000
